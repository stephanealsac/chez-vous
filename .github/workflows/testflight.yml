name: testflight
# Archive non signée (pas d'appareil enregistré → pas de profil de développement) ; signature « distribution » au moment de l'export.
# Envoi sur TestFlight : se déclenche quand ios/release.txt change (une ligne = une version envoyée).
on:
  push:
    paths: ['ios/release.txt']
jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets
        env:
          K1: ${{ secrets.ASC_ISSUER_ID }}
          K2: ${{ secrets.ASC_KEY_ID }}
          K3: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in K1 K2 K3; do [ -n "${!v}" ] || { echo "Secret manquant : $v"; exit 1; }; done
          TID=$(cat ios/team_id.txt | tr -d '[:space:]'); [ ${#TID} -eq 10 ] || { echo "Team ID absent (ios/team_id.txt)"; exit 1; }
          echo "TEAM_ID=$TID" >> $GITHUB_ENV
          echo "Secrets présents, équipe $TID"
      - name: Clé App Store Connect
        env:
          K3: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$K3" > ~/private_keys/AuthKey.p8
      - name: Xcode 26 (exigé par Apple pour l'envoi)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] || { echo "Xcode 26 absent de cette machine"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: Outils, catalogue, projet
        run: |
          brew install xcodegen
          bash ios/prepare.sh
          cd ios && sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$TEAM_ID\"/" project.yml && xcodegen generate
      - name: Archive signée
        env:
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          cd ios
          xcodebuild -project ChezVous.xcodeproj -scheme ChezVous -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ChezVous.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive 2>&1 | tee archive.log | xcpretty
          test -d build/ChezVous.xcarchive || { grep -E "error:" archive.log | head -40; exit 1; }
      - name: Envoi sur App Store Connect (TestFlight)
        env:
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          cd ios
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ChezVous.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" 2>&1 | tee export.log | tail -30
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log || { grep -iE "error" export.log | head -30; exit 1; }
      - name: Nettoyage de la clé
        if: always()
        run: rm -rf ~/private_keys
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log
