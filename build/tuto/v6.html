<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Film 6 — Razzle Dazzle, sous-titres</title>
<link rel="stylesheet" href="../../site/fonts/fonts.css"><link rel="stylesheet" href="common.css">
<style>
body{background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:2600px;perspective-origin:50% 42%;overflow:hidden}
/* iPhone 3D */
.iphone{position:absolute;left:260px;top:390px;width:560px;height:1140px;transform-style:preserve-3d;border-radius:92px;
  background:linear-gradient(135deg,#4a4a4c,#141416 38%,#2a2a2d 68%,#0c0c0d);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),inset 0 0 0 6px #19191b,0 70px 90px rgba(20,14,8,.42),0 20px 30px rgba(20,14,8,.25);opacity:0}
.iphone .scr{position:absolute;inset:16px;border-radius:78px;overflow:hidden;background:#000}
.iphone .island{position:absolute;left:50%;top:34px;width:150px;height:44px;margin-left:-75px;border-radius:24px;background:#000;z-index:5}
.iphone .glare{position:absolute;inset:0;border-radius:92px;background:linear-gradient(112deg,rgba(255,255,255,.16),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 66%,rgba(255,255,255,.07));pointer-events:none;z-index:6}
.iphone .side{position:absolute;width:6px;background:#2d2d30;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.iphone .lay{position:absolute;left:0;top:0;width:528px;height:1108px;opacity:0;overflow:hidden}
.iphone .lay img.page{position:absolute;left:0;top:0;width:528px;height:auto;display:block}
#dark{background:#000}
/* monde RA : la pièce (1080 × 1920) */
.world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#000}
.world img.plate{position:absolute;left:0;top:0;width:1080px;height:1920px}
.world .hang{position:absolute;opacity:0;filter:drop-shadow(10px 18px 22px rgba(20,14,8,.40)) drop-shadow(3px 6px 6px rgba(20,14,8,.28))}
.world .hang img{width:100%;height:100%;display:block}
.world .dots{opacity:0}
.world .dots i{width:9px;height:9px}
.world .pulse{position:absolute;border:5px solid #fff;opacity:0;box-shadow:0 0 30px rgba(255,255,255,.8)}
.world .coach{position:absolute;left:540px;top:380px;opacity:0}
.world .coach svg{position:absolute;left:-150px;top:-60px;width:300px;height:360px;overflow:visible}
#fullwrap{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;opacity:0;background:#000}
.wdim{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.wdim line{stroke:#1a1a1a;stroke-width:4}
.wdim text{font-family:var(--serif);font-size:54px;font-weight:400;fill:#1a1a1a}
/* pastilles */
.pill{position:absolute;padding:22px 38px;border-radius:999px;background:var(--ink);color:var(--bg);font:500 26px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;opacity:0;transform-origin:50% 50%;box-shadow:0 18px 30px rgba(20,14,8,.25)}
.pill b{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:.04em;text-transform:none;margin-left:14px}
/* sous-titres */
#sub{position:absolute;left:60px;right:60px;top:130px;text-align:center;pointer-events:none}
#sub span{display:inline-block;padding:10px 20px;color:var(--ink);font-family:var(--serif);font-style:italic;font-weight:300;font-size:74px;line-height:1.1;letter-spacing:.01em;opacity:0;text-shadow:0 0 22px rgba(238,234,225,.95),0 0 44px rgba(238,234,225,.8);text-wrap:balance}
/* bannière Quick Look */
.banner{position:absolute;left:34px;right:34px;bottom:54px;padding:40px 44px;border-radius:44px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:space-between;gap:30px;transform:translateY(140px);opacity:0}
.banner .t{font:600 38px/1.3 -apple-system,'Helvetica Neue',Helvetica,sans-serif;color:#111}
.banner .s{font:400 30px/1.35 -apple-system,'Helvetica Neue',Helvetica,sans-serif;color:#555;white-space:nowrap}
.banner .b{font:600 34px/1 -apple-system,'Helvetica Neue',Helvetica,sans-serif;color:#0a7cff;white-space:nowrap}
#buy{position:absolute;inset:0;background:var(--bg);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#buy svg{width:260px;height:260px}
#buy .lab{font:500 28px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;margin-top:40px}
#buy .big{font-size:84px;margin-top:26px}
#white{position:absolute;inset:0;background:#fff;opacity:0}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0}
</style></head>
<body>
<div id="stage">
  <div class="iphone" id="ph">
    <div class="side" style="left:-6px;top:250px;height:70px"></div><div class="side" style="left:-6px;top:360px;height:120px"></div><div class="side" style="left:-6px;top:500px;height:120px"></div><div class="side" style="right:-6px;top:380px;height:180px"></div>
    <div class="scr">
      <div class="lay" id="l-cat"><img class="page" src="full-catalogue.png" alt=""></div>
      <div class="lay" id="l-fiche"><img class="page" src="full-zebra.png" alt=""></div>
      <div class="lay" id="dark"></div>
      <div class="lay" id="l-cam"><div class="world" id="w1"></div></div>
    </div>
    <div class="island"></div><div class="glare"></div>
  </div>
  <div class="pill" id="p1">Éditions sur Toile</div>
  <div class="pill" id="p2">Format <b>Classique · 85 × 40 cm</b></div>
  <div class="pill" id="p3">Réalité augmentée</div>
  <div class="ripple" id="rip1" style="border-color:rgba(26,26,26,.9)"></div>

  <div id="fullwrap"><div class="world" id="w2"></div>
    <div class="pill" id="p4"></div>
    <div class="banner" id="banner"><div><div class="t">Razzle Dazzle</div><div class="s">Grand · 140 × 65 cm, 1 820 €</div></div><div class="b">Acquérir ce tirage</div></div>
    <div class="ripple" id="rip2" style="border-color:rgba(255,255,255,.95)"></div>
    <div id="fingerhost"></div>
  </div>
  <div id="white"></div>
  <div id="buy"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="118" fill="none" stroke="#1a1a1a" stroke-width="4" id="ck-c"/><path d="M78 134 L116 172 L186 94" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" id="ck"/></svg></div>
  <div id="sub"><span id="subtxt"></span></div>
  <div id="fade"></div>
</div>
<script src="common.js"></script>
<script>
// ---------- monde : pièce « écran initial », 5.81 px/cm, position finale du Grand = centre (536, 810) ----------
const PK = 5.81, FX = 536, FY = 810;
const SIZES = { classique: [93.6, 48.6, 'zebra-classique.png', 'Classique', '85 × 40'], grand: [148.6, 73.6, 'zebra-grand.png', 'Grand', '140 × 65'] };
const OFF = [-96, 74];   // le Grand apparaît décalé (bas-gauche), puis on le recentre au doigt
// Grand : décalé, puis le doigt lui fait faire un cercle (on peut le mettre n'importe où), puis le pose à sa place
function hangPos(t) {
  const u = clamp((t - 17.4) / 1.3), a = u * Math.PI * 2, r = 110 * Math.sin(u * Math.PI);
  const adj = seg(t, 18.8, 19.8);
  return [lerp(FX + OFF[0] + r * Math.cos(a), FX, adj), lerp(FY + OFF[1] + r * Math.sin(a) * 0.7, FY, adj)];
}
function worldHTML() {
  return `<img class="plate" src="zebra-plate.jpg" alt="">
    <div class="dots"></div>
    <div class="hang"><img src="zebra-classique.png" alt=""></div>
    <div class="pulse"></div>
    <div class="coach"><svg viewBox="0 0 300 360" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"><g class="glyph" style="transform-origin:150px 230px"><rect x="90" y="30" width="120" height="210" rx="26"/><circle cx="150" cy="206" r="6" fill="#fff" stroke="none"/></g><path d="M34 290 q116 84 232 0" stroke-dasharray="4 18" stroke-width="7" opacity=".9"/></svg></div>
    <svg class="wdim" viewBox="0 0 1080 1920"><line class="dh"/><line class="t1"/><line class="t2"/><text class="th" text-anchor="middle"></text><line class="dv"/><line class="t3"/><line class="t4"/><text class="tv" text-anchor="start"></text></svg>`;
}
const worlds = ['w1', 'w2'].map(id => { const w = $(id); w.innerHTML = worldHTML(); makeDots(w.querySelector('.dots'), 80, 100, 150, 880, 1100, 9); return w; });
function setDims(w, cx, cy, wcm, hcm, label) {
  const d = w.querySelector('.wdim'), W = wcm * PK, H = hcm * PK, x0 = cx - W / 2, x1 = cx + W / 2, y0 = cy - H / 2, y1 = cy + H / 2;
  const L = (c, a) => { const e = d.querySelector(c); for (const k in a) e.setAttribute(k, a[k]); };
  L('.dh', { x1: x0, y1: y0 - 56, x2: x1, y2: y0 - 56 }); L('.t1', { x1: x0, y1: y0 - 76, x2: x0, y2: y0 - 36 }); L('.t2', { x1: x1, y1: y0 - 76, x2: x1, y2: y0 - 36 });
  L('.dv', { x1: x1 + 56, y1: y0, x2: x1 + 56, y2: y1 }); L('.t3', { x1: x1 + 36, y1: y0, x2: x1 + 76, y2: y0 }); L('.t4', { x1: x1 + 36, y1: y1, x2: x1 + 76, y2: y1 });
  const th = d.querySelector('.th'); th.setAttribute('x', cx); th.setAttribute('y', y0 - 92); th.textContent = label[0] + ' cm';
  const tv = d.querySelector('.tv'); const fits = x1 + 92 + 150 < 1080;
  tv.setAttribute('text-anchor', fits ? 'start' : 'end'); tv.setAttribute('x', fits ? x1 + 92 : Math.min(x1 + 56 + 70, 1068)); tv.setAttribute('y', fits ? cy + 18 : y0 - 26); tv.textContent = label[1] + ' cm';
}
function worldState(w, t) {
  const h = w.querySelector('.hang'), img = h.querySelector('img');
  const grand = t >= 15.6;
  const S = grand ? SIZES.grand : SIZES.classique; if (!img.src.endsWith(S[2])) img.src = S[2];
  const [cx, cy] = grand ? hangPos(t) : [FX, FY];
  placeHang(h, cx, cy, S[0], S[1], PK);
  const ap = seg(t, 12.3, 13.3), bump = t >= 15.6 && t < 15.95 ? Math.sin((t - 15.6) / .35 * Math.PI) : 0;
  show(h, ap, `scale(${0.94 + 0.06 * ap + 0.02 * bump})`);
  animDots(w.querySelector('.dots'), t, win(t, 9.9, 10.6, 12.0, 12.8));
  const c = w.querySelector('.coach'); c.style.opacity = win(t, 7.3, 7.9, 11.6, 12.2); c.querySelector('.glyph').style.transform = `rotate(${Math.sin((t - 7) * 2.6) * 16}deg)`;
  const pu = win(t, 12.3, 12.5, 12.8, 13.8), g = 1 + 0.3 * seg(t, 12.3, 13.8), pw = S[0] * PK * g, phh = S[1] * PK * g;
  Object.assign(w.querySelector('.pulse').style, { left: cx - pw / 2 + 'px', top: cy - phh / 2 + 'px', width: pw + 'px', height: phh + 'px', opacity: pu * .9 });
  // cotes : Classique (13.2 → 15.2), puis Grand une fois centré (19.6 → 21.4)
  const d = w.querySelector('.wdim'); const dv = Math.max(win(t, 13.2, 13.6, 14.9, 15.3), win(t, 20.2, 20.6, 21.8, 22.2));
  d.style.opacity = dv; setDims(w, cx, cy, S[0], S[1], grand ? ['140', '65'] : ['85', '40']);
}
$('fingerhost').innerHTML = fingerHTML('fg');
const ph = $('ph'), SW = 528, SH = 1108, ZS = SH / 1920;
const K2 = 528 / 780;
const CARD = [97.75 * 2 * K2, 3152.7 * 2 * K2], BTN = [195 * 2 * K2, 683.4 * 2 * K2];
const easeBack = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function pop(el, t, a, hold, x, y) { const u = clamp((t - a) / .55); const out = hold ? 1 - seg(t, hold, hold + .4) : 1; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = (u > 0 ? 1 : 0) * out; el.style.transform = `scale(${u > 0 ? easeBack(u) : 0})`; }
// sous-titres : [début, fin, texte]
const SUBS = [
  [1.0, 3.4, 'Choisissez une Édition sur Toile'],
  [3.8, 6.6, 'Cliquez sur « Voir sur mon mur »'],
  [7.4, 11.8, 'Balayez lentement votre mur'],
  [12.4, 15.2, 'L\'œuvre s\'accroche, à sa taille réelle'],
  [15.6, 17.2, 'Changez de format'],
  [17.2, 20.2, 'Ajustez sa position du doigt'],
  [21.2, 26.0, 'Commandez-la directement'],
];
function subtitle(t) {
  const s = $('subtxt'); let v = 0, txt = '';
  for (const [a, b, x] of SUBS) if (t >= a - .3 && t <= b + .3) { v = win(t, a - .3, a, b, b + .3); txt = x; }
  s.textContent = txt; s.style.opacity = v; s.style.transform = `translateY(${8 - 8 * v}px)`;
}

window.DURATION = 29.2;
window.render = function (t) {
  // ---------- iPhone ----------
  const enter = seg(t, 0.2, 1.2);
  const sway = Math.sin(t * 0.9) * 5, swayX = Math.sin(t * 0.7 + 1) * 4;
  const hand = t > 7.0 ? 1 : 0;
  const zoom = seg(t, 8.6, 9.9);
  const hs = hand * (1 - zoom);
  const rotY = lerp(-14, 7 + swayX, enter) * (1 - zoom) + hs * Math.sin((t - 7) * 1.8) * 6;
  const rotX = lerp(6, 3 + sway * .4, enter) * (1 - zoom) + hs * Math.sin((t - 7) * 1.3) * 4;
  const sc = lerp(1, 1.74, easeOut(zoom));
  const ty = lerp(1500, 0, easeOut(enter)) + Math.sin(t * 1.1) * 8 * (1 - zoom);
  const tx = hs * Math.sin((t - 7) * 1.5) * 18;
  const cx0 = 540, cy0 = 960; const dx = (540 - cx0) * zoom, dy = (960 - cy0) * zoom;
  ph.style.opacity = enter > 0 && t < 10.3 ? 1 : 0;
  ph.style.transform = `translate3d(${tx + dx}px,${ty + dy}px,0) rotateY(${rotY}deg) rotateX(${rotX}deg) scale(${sc})`;
  const catScroll = lerp(0, CARD[1] - 560, seg(t, 1.1, 3.0));
  $('l-cat').style.opacity = win(t, 0, 0.1, 3.5, 3.8); $('l-cat').querySelector('img').style.transform = `translateY(${-catScroll}px)`;
  $('l-fiche').style.opacity = win(t, 3.5, 3.8, 6.4, 6.9);
  $('dark').style.opacity = win(t, 6.4, 6.9, 7.0, 7.5);
  $('l-cam').style.opacity = win(t, 7.0, 7.2);
  const drift = hand * (Math.sin((t - 7) * 1.4) * 40 * (1 - zoom));
  $('w1').style.transform = `translate(${(SW - 1080 * ZS) / 2 + drift * ZS}px,0) scale(${ZS})`;
  worldState($('w1'), t);
  const scrLeft = 260 + 16 + tx, scrTop = 390 + 16 + ty;
  const taps1 = [[3.2, CARD[0], CARD[1] - catScroll], [6.2, BTN[0], BTN[1]]];
  $('rip1').style.opacity = 0;
  for (const [t0, x, y] of taps1) if (t >= t0 && t < t0 + .7) rippleAt($('rip1'), scrLeft + x, scrTop + y, t, t0);
  pop($('p1'), t, 1.3, 3.0, 70, 1600);
  pop($('p2'), t, 4.2, 6.0, 300, 1600);
  pop($('p3'), t, 7.3, 8.5, 400, 1600);
  // ---------- plein cadre ----------
  const fw = $('fullwrap'); fw.style.opacity = win(t, 9.75, 10.05, 26.2, 26.9);
  const settle = seg(t, 10.0, 11.4);
  const ws = lerp(1.74 * ZS, 1.035, settle) - 0.035 * seg(t, 12.0, 13.4);   // léger sur-cadrage tant que la main bouge (pas de bord noir)
  const drift2 = Math.sin((t - 9.8) * 1.2) * 10 * (1 - seg(t, 12, 13)) + Math.sin(t * 2.3) * 2;
  const ox = 540 - 540 * ws + drift2, oy = 960 - 960 * ws + Math.sin(t * 1.7) * 3;
  $('w2').style.transform = `translate(${ox}px,${oy}px) scale(${ws})`;
  worldState($('w2'), t);
  // pastilles de format sur le mur
  if (t >= 13.0 && t < 15.6) pop($('p4'), t, 13.0, 15.1, 70, 340); else if (t >= 15.6 && t < 20.6) pop($('p4'), t, 15.6, 20.1, 70, 340); else $('p4').style.opacity = 0;
  $('p4').innerHTML = t < 15.6 ? 'Classique <b>85 × 40 cm</b>' : 'Grand <b>140 × 65 cm</b>';
  const b = seg(t, 21.0, 21.8); show($('banner'), b, `translateY(${140 - 140 * b}px)`);
  // doigt : recentrage du Grand (17.0 → 19.8), puis « Acquérir ce tirage » (22.2 → 24.0)
  const [hx0, hy0] = hangPos(t); const hx = hx0, hy = hy0 + 40;
  let fx = 1250, fy = 2200, vis = 0, press = 0;
  if (t > 16.6 && t < 20.6) { const u = seg(t, 16.6, 17.3); fx = lerp(1250, hx, u); fy = lerp(2200, hy, u); const o = seg(t, 19.9, 20.5); fx = lerp(fx, 1250, o); fy = lerp(fy, 2200, o); vis = 1; press = t > 17.3 && t < 19.85 ? 1 : 0; }
  if (t > 22.8 && t < 24.8) { const u = seg(t, 22.8, 23.5); fx = lerp(1250, 870, u); fy = lerp(2200, 1800, u); const o = seg(t, 24.1, 24.7); fx = lerp(fx, 1250, o); fy = lerp(fy, 2200, o); vis = 1; press = win(t, 23.65, 23.8, 23.95, 24.1); }
  fingerAt($('fg'), fx, fy, press, vis);
  $('rip2').style.opacity = 0;
  if (t >= 17.3 && t < 18.0) rippleAt($('rip2'), FX + OFF[0], FY + OFF[1] + 40, t, 17.3);
  if (t >= 23.75 && t < 24.4) rippleAt($('rip2'), 870, 1800, t, 23.75);
  // ---------- commande ----------
  $('white').style.opacity = win(t, 26.2, 26.4, 26.45, 26.9);
  $('buy').style.opacity = win(t, 26.6, 27.1, 99, 100);
  const ck = seg(t, 27.1, 27.8); $('ck').style.strokeDasharray = 200; $('ck').style.strokeDashoffset = 200 * (1 - ck);
  $('ck-c').style.strokeDasharray = 742; $('ck-c').style.strokeDashoffset = 742 * (1 - seg(t, 26.7, 27.6));
  subtitle(t);
  $('fade').style.opacity = seg(t, 28.6, 29.2);
};
render(0);
</script>
</body></html>
