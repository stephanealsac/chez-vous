<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Film 1 — Le geste</title>
<link rel="stylesheet" href="../../site/fonts/fonts.css"><link rel="stylesheet" href="common.css">
<style>
#scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 45%}
#veil{position:absolute;inset:0;background:var(--bg);opacity:1}
#pulse{position:absolute;border:4px solid #fff;opacity:0;box-shadow:0 0 24px rgba(255,255,255,.8)}
</style></head>
<body>
<div id="scene"></div>
<div class="abs card" id="c-end" style="background:var(--bg)">
  <div class="brand">Stéphane Alsac</div>
  <div class="big" style="font-size:118px">Éditions sur Toile</div>
  <div class="rule"></div>
  <div class="site">chez-vous.stephane-alsac.com</div>
</div>
<script src="common.js"></script>
<script>
const CX = 740, CY = 600, WCM = 68.6, HCM = 88.6;
const scene = $('scene');
scene.innerHTML = roomHTML('room') + personHTML('me') +
  `<div class="phone" id="phone" style="width:200px;height:400px"><div class="screen"><div class="cam" id="cam">${roomHTML('camroom')}</div><div id="off" style="position:absolute;inset:0;background:#0a0a0a"></div></div><div class="thumb"></div></div>` +
  `<svg class="dim" id="dim" width="1080" height="1920">
     <line id="dh" x1="${CX - WCM * PX_CM / 2}" y1="${CY - HCM * PX_CM / 2 - 46}" x2="${CX + WCM * PX_CM / 2}" y2="${CY - HCM * PX_CM / 2 - 46}"/>
     <line x1="${CX - WCM * PX_CM / 2}" y1="${CY - HCM * PX_CM / 2 - 60}" x2="${CX - WCM * PX_CM / 2}" y2="${CY - HCM * PX_CM / 2 - 32}"/>
     <line x1="${CX + WCM * PX_CM / 2}" y1="${CY - HCM * PX_CM / 2 - 60}" x2="${CX + WCM * PX_CM / 2}" y2="${CY - HCM * PX_CM / 2 - 32}"/>
     <text id="th" x="${CX}" y="${CY - HCM * PX_CM / 2 - 70}" text-anchor="middle">60 cm</text>
     <line id="dv" x1="${CX - WCM * PX_CM / 2 - 46}" y1="${CY - HCM * PX_CM / 2}" x2="${CX - WCM * PX_CM / 2 - 46}" y2="${CY + HCM * PX_CM / 2}"/>
     <line x1="${CX - WCM * PX_CM / 2 - 60}" y1="${CY - HCM * PX_CM / 2}" x2="${CX - WCM * PX_CM / 2 - 32}" y2="${CY - HCM * PX_CM / 2}"/>
     <line x1="${CX - WCM * PX_CM / 2 - 60}" y1="${CY + HCM * PX_CM / 2}" x2="${CX - WCM * PX_CM / 2 - 32}" y2="${CY + HCM * PX_CM / 2}"/>
     <text id="tv" x="${CX - WCM * PX_CM / 2 - 70}" y="${CY + 18}" text-anchor="end">80 cm</text>
   </svg>` +
  `<div id="pulse"></div><div id="veil"></div>`;
placeHang($('room-hang'), CX, CY, WCM, HCM);
placeHang($('camroom-hang'), CX, CY, WCM, HCM);
makeDots($('camroom-dots'), 90, 420, 250, 620, 720, 3);
const me = $('me'); me.style.left = '180px'; me.style.top = '800px';
const phone = $('phone'), cam = $('cam');
const SW = 182, SH = 382, Z = 0.42;   // écran du téléphone, zoom caméra
// lignes de cote : longueur pour l'animation de tracé
for (const id of ['dh', 'dv']) { const l = $(id); const len = Math.hypot(l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value); l.style.strokeDasharray = len; l.dataset.len = len; }

window.DURATION = 26;
window.render = function (t) {
  // décor
  $('veil').style.opacity = 1 - seg(t, 0, 1.4);
  const push = 1 + 0.05 * seg(t, 19.5, 24);
  scene.style.transform = `scale(${push})`;
  // la personne entre
  const pin = seg(t, 1.6, 3.2);
  show(me, pin, `translateY(${60 - 60 * pin}px)`);
  // bras : baissé puis levé (3.4 → 4.6), puis rebaissé (14.6 → 15.8)
  const up = win(t, 3.4, 4.6, 14.6, 15.8);
  $('me-armUp').style.opacity = up; $('me-armDown').style.opacity = 1 - up;
  $('off').style.opacity = 1 - win(t, 3.6, 4.4, 15.0, 15.8);
  // balayage lent du téléphone (5 → 10)
  const sw = t < 5 ? 0 : t < 10 ? Math.sin((t - 5) / 5 * Math.PI * 2) * seg(t, 5, 6) * (1 - seg(t, 9, 10)) : 0;
  const dx = sw * 70, rot = sw * -5;
  // téléphone : position selon le bras
  const pUp = { x: 440, y: 560, r: -3 }, pDown = { x: 405, y: 1120, r: -25 };
  const px = lerp(pDown.x, pUp.x, up) + dx, py = lerp(pDown.y, pUp.y, up), pr = lerp(pDown.r, pUp.r, up) + rot;
  show(phone, seg(t, 3.2, 3.8), '');
  phone.style.left = px + 'px'; phone.style.top = py + 'px'; phone.style.transform = `rotate(${pr}deg)`;
  // écran : la pièce vue par la caméra, centrée sur le mur devant (parallaxe pendant le balayage)
  const fx = CX + dx * 1.6, fy = CY + (1 - up) * 700;
  cam.style.transform = `translate(${SW / 2 - fx * Z}px, ${SH / 2 - fy * Z}px) scale(${Z})`;
  // détection du mur : points qui scintillent pendant le balayage
  animDots($('camroom-dots'), t, win(t, 5.6, 6.4, 9.6, 10.6));
  // le tableau apparaît dans l'écran (10.4 → 12), puis sur le vrai mur quand le téléphone redescend (15 → 16.4)
  const inScreen = seg(t, 10.4, 12);
  show($('camroom-hang'), inScreen, `scale(${0.96 + 0.04 * inScreen})`);
  const onWall = seg(t, 15.0, 16.4);
  show($('room-hang'), onWall, `scale(${0.985 + 0.015 * onWall})`);
  // halo d'accrochage dans l'écran
  const pu = win(t, 10.4, 10.7, 10.9, 12.2);
  const hw = WCM * PX_CM * Z, hh = HCM * PX_CM * Z, hx = px + 9 + SW / 2 - (fx - CX) * Z, hy = py + 9 + SH / 2 - (fy - CY) * Z;
  const grow = 1 + 0.25 * seg(t, 10.4, 12.2);
  Object.assign($('pulse').style, { left: (hx - hw / 2 * grow) + 'px', top: (hy - hh / 2 * grow) + 'px', width: hw * grow + 'px', height: hh * grow + 'px', opacity: pu * 0.9, transform: `rotate(${pr}deg)` });
  // cotes (16.8 → 19.5)
  const d = seg(t, 16.8, 18.4);
  $('dim').style.opacity = win(t, 16.8, 17.2, 23.0, 24.0);
  $('dh').style.strokeDashoffset = (1 - d) * +$('dh').dataset.len; $('dv').style.strokeDashoffset = (1 - d) * +$('dv').dataset.len;
  $('th').style.opacity = seg(t, 17.8, 18.6); $('tv').style.opacity = seg(t, 18.2, 19.0);
  // fin
  $('c-end').style.opacity = win(t, 23.6, 24.6);
};
render(0);
</script>
</body></html>
