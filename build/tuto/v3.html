<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Film 3 — À la première personne</title>
<link rel="stylesheet" href="../../site/fonts/fonts.css"><link rel="stylesheet" href="common.css">
<style>
.scr{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.scr img{width:100%;height:100%;display:block}
#camwrap{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;overflow:hidden;background:#000}
#camwrap .room{transform-origin:50% 50%}
#black{position:absolute;inset:0;background:#000;opacity:0}
#coach{position:absolute;left:540px;top:380px;width:0;height:0;opacity:0}
#coach svg{position:absolute;left:-120px;top:-40px;width:240px;height:300px;overflow:visible}
.banner{position:absolute;left:34px;right:34px;bottom:54px;padding:40px 44px;border-radius:44px;background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:space-between;gap:30px;transform:translateY(120px);opacity:0}
.banner .t{font:600 38px/1.3 -apple-system,'Helvetica Neue',Helvetica,sans-serif;color:#111}
.banner .s{font:400 30px/1.35 -apple-system,'Helvetica Neue',Helvetica,sans-serif;color:#555;white-space:nowrap}
.banner .b{font:600 34px/1 -apple-system,'Helvetica Neue',Helvetica,sans-serif;color:#0a7cff;white-space:nowrap}
#c-open{opacity:0}
</style></head>
<body>
<div class="abs card" id="c-open"><div class="brand">Stéphane Alsac</div><div class="big">Chez vous</div></div>
<div class="scr" id="s1"><img src="scr16-catalogue.png" alt=""></div>
<div class="scr" id="s2"><img src="scr16-fiche.png" alt=""></div>
<div id="camwrap">
  <div id="roomhost"></div>
  <div id="coach"><svg viewBox="0 0 240 300" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
    <g id="glyph" style="transform-origin:120px 190px"><rect x="72" y="20" width="96" height="176" rx="22"/><circle cx="120" cy="170" r="5" fill="#fff" stroke="none"/></g>
    <path d="M28 236 q92 70 184 0" stroke-dasharray="4 16" stroke-width="6" opacity=".85"/>
  </svg></div>
  <div class="banner" id="banner"><div><div class="t">Coeur de Chêne</div><div class="s">Classique · 60 × 80 cm, 1 150 €</div></div><div class="b">Acquérir ce tirage</div></div>
</div>
<div id="black"></div>
<div class="ripple" id="rip"></div>
<div id="fingerhost"></div>
<div class="abs card" id="c-end" style="background:var(--bg)">
  <div class="brand">Stéphane Alsac</div>
  <div class="big" style="font-size:118px">Éditions sur Toile</div>
  <div class="rule"></div>
  <div class="site">chez-vous.stephane-alsac.com</div>
</div>
<script src="common.js"></script>
<script>
$('roomhost').innerHTML = roomHTML('room');
$('fingerhost').innerHTML = fingerHTML('fg');
const K = 1080 / 390;
const T = { card: [97.75 * K, 253.1 * K], size: [195 * K, 448.9 * K], btn: [195 * K, 608 * K] };
const CX = 540, CY = 720, WCM = 68.6, HCM = 88.6;
const hang = $('room-hang'); placeHang(hang, CX, CY, WCM, HCM);
makeDots($('room-dots'), 80, 120, 200, 840, 1000, 5);
const fg = $('fg'), rip = $('rip'), room = $('room');
window.DURATION = 26;
window.render = function (t) {
  $('c-open').style.opacity = win(t, 0.1, 0.7, 1.0, 1.7);
  // écrans de l'appli
  $('s1').style.opacity = win(t, 1.3, 1.9, 3.5, 4.0);
  $('s2').style.opacity = win(t, 3.5, 4.0, 7.3, 7.9);
  $('black').style.opacity = win(t, 7.3, 7.9, 8.0, 8.8);
  // caméra
  $('camwrap').style.opacity = win(t, 7.9, 8.1, 21.0, 22.0);
  const sw = t < 8.8 ? 0 : t < 13.0 ? Math.sin((t - 8.8) / 4.2 * Math.PI * 2) * seg(t, 8.8, 9.6) * (1 - seg(t, 12.2, 13.0)) : 0;
  const jitter = Math.sin(t * 1.7) * 6 + Math.sin(t * 2.9) * 4;
  room.style.transform = `translate(${sw * 48 + jitter}px, ${Math.sin(t * 1.3) * 5}px) scale(1.06)`;
  // guide de mouvement (comme iOS)
  $('coach').style.opacity = win(t, 8.8, 9.4, 12.2, 12.9);
  $('glyph').style.transform = `rotate(${Math.sin((t - 8.8) * 2.4) * 16}deg)`;
  animDots($('room-dots'), t, win(t, 9.6, 10.4, 12.4, 13.4));
  // le tableau s'accroche, puis on le déplace du doigt
  const ap = seg(t, 12.9, 14.2);
  const drag = 140 * seg(t, 15.4, 17.0);
  show(hang, ap, `translate(${drag}px,0) scale(${0.96 + 0.04 * ap})`);
  // bannière Quick Look
  const b = seg(t, 17.9, 18.7);
  show($('banner'), b, `translateY(${120 - 120 * b}px)`);
  // doigt : entrée, touches, glissement, sortie
  let fx = 1250, fy = 2200, vis = 0, press = 0;
  const path = [
    { a: 2.0, b: 2.9, from: [1250, 2200], to: T.card },            // vers la vignette
    { a: 3.1, b: 3.4, press: 1 },
    { a: 3.6, b: 4.9, from: T.card, to: T.size },                // vers le format
    { a: 5.0, b: 5.3, press: 1 },
    { a: 5.6, b: 6.7, from: T.size, to: T.btn },                 // vers « Voir sur mon mur »
    { a: 6.9, b: 7.2, press: 1 },
    { a: 7.3, b: 7.9, from: T.btn, to: [1250, 2200] },            // sortie
    { a: 14.5, b: 15.2, from: [1250, 2200], to: [CX, CY + 60] },  // vers le tableau
    { a: 15.2, b: 15.4, press: 1 },
    { a: 15.4, b: 17.0, from: [CX, CY + 60], to: [CX + 140, CY + 60], hold: 1 },   // glissement
    { a: 17.2, b: 17.9, from: [CX + 140, CY + 60], to: [1250, 2200] },             // sortie
    { a: 19.4, b: 20.1, from: [1250, 2200], to: [860, 1800] },    // vers « Acquérir ce tirage »
    { a: 20.2, b: 20.5, press: 1 },
    { a: 20.8, b: 21.6, from: [860, 1800], to: [1250, 2200] },
  ];
  let cur = null;
  for (const p of path) { if (p.from && t >= p.a) { const u = seg(t, p.a, p.b); fx = lerp(p.from[0], p.to[0], u); fy = lerp(p.from[1], p.to[1], u); cur = p; } }
  for (const p of path) if (p.press && t >= p.a && t <= p.b + .25) press = t < p.b ? seg(t, p.a, p.b) : 1 - seg(t, p.b, p.b + .25);
  if (t >= 15.2 && t <= 17.0) press = 1;
  vis = (t > 1.9 && t < 8.0) || (t > 14.4 && t < 18.0) || (t > 19.3 && t < 21.7) ? 1 : 0;
  fingerAt(fg, fx, fy, press, vis);
  // ondes de contact
  const taps = [[3.3, ...T.card], [5.2, ...T.size], [7.1, ...T.btn], [15.35, CX, CY + 60], [20.4, 860, 1800]];
  rip.style.opacity = 0;
  for (const [t0, x, y] of taps) if (t >= t0 && t < t0 + .7) rippleAt(rip, x, y, t, t0);
  rip.style.borderColor = t > 8 && t < 21 ? 'rgba(255,255,255,.95)' : 'rgba(26,26,26,.9)';
  // fin
  $('c-end').style.opacity = win(t, 21.2, 22.2);
};
render(0);
</script>
</body></html>
