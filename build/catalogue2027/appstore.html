<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../site/fonts/fonts.css">
<style>
/* Capture App Store 6,9" (1320 × 2868) : légende + écran de l'appli dans un iPhone, fond parchemin */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:440px;height:956px;overflow:hidden;background:#eeeae1}
.cap{position:absolute;left:28px;right:28px;top:70px;text-align:center;color:#1a1a1a;font:italic 300 40px/1.12 'Cormorant Garamond';text-wrap:balance}
.rule{position:absolute;left:50%;top:0;width:60px;height:1px;background:#9f998d;transform:translateX(-50%)}
.phone{position:absolute;left:50%;top:232px;width:356px;height:772px;transform:translateX(-50%);border-radius:56px;background:linear-gradient(135deg,#4a4a4c,#141416 38%,#2a2a2d 68%,#0c0c0d);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),inset 0 0 0 5px #19191b,0 30px 50px rgba(20,14,8,.28)}
.phone .scr{position:absolute;left:11px;right:11px;top:11px;bottom:11px;border-radius:46px;overflow:hidden;background:#000}
.phone .scr img{width:100%;display:block}
.phone .island{position:absolute;left:50%;top:22px;width:96px;height:28px;transform:translateX(-50%);border-radius:999px;background:#000}
</style></head><body>
<div class="cap" id="cap"></div>
<div class="phone"><div class="scr"><img id="shot"></div><div class="island"></div></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('cap').textContent = q.get('cap');
document.getElementById('shot').src = q.get('shot');
const c = document.getElementById('cap'), r = document.createElement('div'); r.className = 'rule';
</script></body></html>
