<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../site/fonts/fonts.css">
<style>
/* Écran RA de l'appli « Chez vous », reproduit à l'identique (unités = points iOS, 390 × 844) */
:root{--bg:#eeeae1;--ink:#1a1a1a;--soft:#4a4a4a;--border:#d4cfc4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.cam{position:absolute;inset:0;overflow:hidden}
.cam img.plate{position:absolute;height:100%;width:auto;left:50%;transform:translateX(-50%)}
.hang{position:absolute;filter:drop-shadow(3px 6px 8px rgba(20,14,8,.35))}
.top{position:absolute;left:16px;right:16px;top:calc(54px + (100vh - 844px) * .1);display:flex;justify-content:space-between;align-items:center}
.close{width:44px;height:44px;border-radius:50%;background:rgba(238,234,225,.92);display:grid;place-items:center}
.close svg{width:15px;height:15px}
.replace{height:44px;padding:0 14px;border-radius:22px;background:rgba(238,234,225,.92);display:flex;align-items:center;gap:6px;font:400 10px/1 'Raleway';letter-spacing:2px;text-transform:uppercase;color:var(--ink)}
.replace svg{width:14px;height:14px}
.hint{position:absolute;left:28px;right:28px;top:116px;text-align:center;color:var(--ink);font-family:'Cormorant Garamond';font-style:italic;font-weight:300;text-shadow:0 0 10px rgba(238,234,225,.95),0 0 20px rgba(238,234,225,.8)}
.hint .h{font-size:30px;line-height:1.15}
.hint .s{font-size:18px;line-height:1.25;margin-top:4px}
.bottom{position:absolute;left:16px;right:16px;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.fmts{display:flex;gap:8px}
.fmts .f{padding:8px 14px;text-align:center;background:rgba(238,234,225,.92);color:var(--ink)}
.fmts .f.on{background:var(--ink);color:var(--bg)}
.fmts b{display:block;font:italic 300 19px/1.15 'Cormorant Garamond'}
.fmts i{display:block;font:300 11px/1.3 'Raleway';font-style:normal}
.card{align-self:stretch;display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 18px;background:rgba(238,234,225,.95)}
.card .t{font:italic 300 21px/1.1 'Cormorant Garamond';color:var(--ink)}
.card .d{font:300 12px/1.4 'Raleway';color:var(--soft);margin-top:2px}
.card .b{height:40px;padding:0 16px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:400 10px/1 'Raleway';letter-spacing:2.2px;text-transform:uppercase}
</style></head><body>
<div class="cam"><img class="plate" src="zebra-plate.jpg" alt=""><div class="hang" id="hang"><img src="zebra-classique.png" style="width:100%;height:100%" alt=""></div></div>
<div class="top">
  <div class="close"><svg viewBox="0 0 16 16" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"><path d="M3 3 L13 13 M13 3 L3 13"/></svg></div>
  <div class="replace"><svg viewBox="0 0 16 16" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 6.5 A5 5 0 1 1 3 9"/><path d="M3.5 2.8 V6.5 H7.2"/></svg><span id="rep"></span></div>
</div>
<div class="hint"><div class="h" id="h"></div><div class="s" id="s"></div></div>
<div class="bottom">
  <div class="fmts"><div class="f on"><b id="f1"></b><i id="d1"></i></div><div class="f"><b id="f2"></b><i id="d2"></i></div></div>
  <div class="card"><div><div class="t">Razzle Dazzle</div><div class="d" id="cd"></div></div><div class="b" id="buy"></div></div>
</div>
<script>
const en = new URLSearchParams(location.search).get('lang') === 'en';
const T = en ? { rep:'Re-place', h:'Actual size', s:'The piece appears at the exact size of the real artwork.<br>Slide it with one finger to move it.', f1:'Classic', d1:'33.5 × 15.7 in', f2:'Large', d2:'55.1 × 25.6 in', cd:'Classic · 33.5 × 15.7 in · $1,400', buy:'Buy' }
             : { rep:'Replacer', h:'Taille réelle', s:'L\'œuvre apparaît aux dimensions exactes du tableau.<br>Glissez-la d\'un doigt pour la déplacer.', f1:'Classique', d1:'85 × 40 cm', f2:'Grand', d2:'140 × 65 cm', cd:'Classique · 85 × 40 cm · 1 150 €', buy:'Acquérir' };
for (const k in T) document.getElementById(k).innerHTML = T[k];
// même géométrie que le tutoriel : photo 1080 × 1920, 5,81 px/cm, œuvre Classique (93,6 × 48,6 cm cadre compris) centrée en (536, 810)
const H = innerHeight, Wd = innerWidth, k = H / 1920, plateW = 1080 * k, left = (Wd - plateW) / 2;
const w = 93.6 * 5.81 * k, h = 48.6 * 5.81 * k, cx = left + 536 * k, cy = 810 * k;
Object.assign(document.getElementById('hang').style, { left: cx - w / 2 + 'px', top: cy - h / 2 + 'px', width: w + 'px', height: h + 'px' });
</script></body></html>
