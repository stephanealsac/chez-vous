<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>if (location.hostname === 'app.stephane-alsac.com') location.replace('/go/' + location.search);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eeeae1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chez vous">
<title>Chez vous — Stéphane Alsac</title>
<meta name="description" content="Visualisez les Éditions sur Toile de Stéphane Alsac sur votre mur, à taille réelle, en réalité augmentée.">
<meta property="og:type" content="website">
<meta property="og:title" content="Chez vous — Stéphane Alsac">
<meta property="og:description" content="Posez une Édition sur Toile sur votre mur, à taille réelle, en réalité augmentée.">
<meta property="og:image" content="https://chez-vous.stephane-alsac.com/og-image.jpg">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Jetons repris de la charte du site stephane-alsac.com (parchemin, Cormorant Garamond + Raleway, filets, zéro décoration). */
:root{
  --bg:#eeeae1; --bg2:#e2dbcc; --border:#d4cfc4; --ink:#1a1a1a; --ink-soft:#4a4a4a; --muted:#6a665e; --label:#404040;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Raleway',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
body.tuto-open{overflow:hidden;position:fixed;inset:0;width:100%}
button,a{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{background:none;border:0;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
img{display:block;max-width:100%}
.serif-note{font-family:var(--serif);font-style:italic;font-weight:300;font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ----- en-tête : logo texte identique au site (Cormorant 14px / .22em) ----- */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(8px + var(--sat)) var(--gr) 8px var(--gl);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(56px + var(--sat))}
.brand{grid-column:2;font:400 14px/1 var(--serif);letter-spacing:.22em;text-transform:uppercase;color:var(--ink);text-decoration:none;text-align:center;padding:6px 0}
.brand small{display:block;font:300 9px/1 var(--sans);letter-spacing:.25em;color:var(--muted);margin-top:6px}
.hdr-r{grid-column:3;justify-self:end;display:flex;align-items:center;gap:2px}
.lang-btn{min-width:44px;height:44px;font:500 10px/1 var(--sans);letter-spacing:.2em;color:var(--ink-soft);padding-left:.2em}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;font:300 20px/1 var(--serif);font-style:italic}
.icon-btn span{width:32px;height:32px;border:1px solid var(--border);display:grid;place-items:center;transition:border-color .3s}
.icon-btn:active span{border-color:var(--ink)}
.back{grid-column:1;justify-self:start;display:none;align-items:center;gap:8px;font:400 9px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink-soft);min-height:44px;padding:0 8px 0 0}
body.view-work .back{display:flex}

/* ----- catalogue ----- */
main{padding-bottom:calc(32px + var(--sab))}
body.view-work main{padding-bottom:0}
.intro{padding:38px var(--gr) 30px var(--gl);border-bottom:1px solid var(--border);text-align:center}
.intro h1{font:400 22px/1.2 var(--serif);letter-spacing:.25em;text-transform:uppercase;color:var(--ink);padding-left:.25em;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--border)}
.card{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:14px 14px 18px;text-decoration:none;display:block;transition:background .3s;-webkit-touch-callout:none}
.card:active{background:rgba(26,26,26,.03)}
.card .ph{aspect-ratio:1/1;width:100%;overflow:hidden;background:var(--bg2)}
.card img{width:100%;height:100%;object-fit:cover;object-position:center}
.card h2{font-family:var(--serif);font-style:italic;font-weight:300;font-size:21px;line-height:1.1;margin-top:14px;text-align:center;text-wrap:balance}
.card .meta{font-family:var(--serif);font-style:italic;font-weight:300;font-size:15px;color:var(--muted);margin-top:4px;text-align:center;font-variant-numeric:tabular-nums}
.empty{padding:40px var(--gr);text-align:center;color:var(--ink-soft);font-size:13px;grid-column:1/-1;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}

/* ----- fiche ----- */
.work{display:none}
body.view-work .work{display:block}
body.view-work .catalogue{display:none}
.hero{padding:28px var(--gr) 12px var(--gl);display:grid;place-items:center;min-height:46vw}
.hero img{max-height:52vh;filter:drop-shadow(0 10px 16px rgba(26,26,26,.22))}
.work-head{padding:10px var(--gr) 24px var(--gl);border-bottom:1px solid var(--border);text-align:center}
.work-head .tech{font:400 9px/1.6 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--label);margin-bottom:10px}
.work-head h1{font-family:var(--serif);font-style:italic;font-weight:300;font-size:36px;line-height:1.05;letter-spacing:.03em;text-wrap:balance}
.section{border-bottom:1px solid var(--border);padding:22px var(--gr) 22px var(--gl)}
.label{font:400 10px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--label);margin-bottom:14px}
.sizes{display:flex;flex-direction:column;gap:8px}
.size{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:62px;padding:12px 16px;border:1px solid var(--border);text-align:left;background:transparent;transition:border-color .2s,background .2s;font-size:12px;width:100%}
.size .l{font-family:var(--serif);font-size:24px;font-weight:300;line-height:1;font-style:italic;min-width:4.6em}
.size .d{font-size:15px;letter-spacing:.04em;color:var(--ink-soft);flex:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.size .p{font-family:var(--serif);font-size:24px;font-weight:300;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.size[aria-checked=true]{border-color:var(--ink);background:rgba(26,26,26,.03)}
.dims{margin-top:16px;text-align:center;font-size:16px}
.dims b{font-family:var(--sans);font-weight:400;font-style:normal;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* moteur RA Android (invisible) */
.ar-engine{position:absolute;left:-9999px;top:0;width:2px;height:2px;overflow:hidden}
model-viewer{width:2px;height:2px}
/* au lancement (Android) : le lecteur doit être visible pour que Chrome démarre la RA */
.ar-engine.live{position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;background:var(--bg)}
.ar-engine.live model-viewer{width:100%;height:100%;background:var(--bg)}

/* actions : bouton principal épinglé, liens secondaires discrets */
.actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:12px var(--gr) calc(10px + var(--sab)) var(--gl);display:grid;gap:6px;z-index:9}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border:1px solid var(--ink);font:400 11px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;text-decoration:none;background:transparent;width:100%;transition:background .3s,color .3s}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:active{background:#333}
.btn:active{background:rgba(26,26,26,.05)}
.link{display:flex;align-items:center;justify-content:center;min-height:44px;font:400 9px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none}
.link span{border-bottom:1px solid var(--border);padding-bottom:3px}
.ar-msg{text-align:center;display:none;padding-bottom:4px}
.ar-tip{text-align:center;font-size:14px;line-height:1.35;padding:0 4px 4px;display:none}
body.ar-ok .ar-tip{display:block}
body.ar-ok .ar-msg.on~.btn{margin-top:0}
.ar-msg.on{display:block}

/* ----- tutoriel (vidéo) ----- */
.tuto{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding:calc(12px + var(--sat)) var(--gr) calc(12px + var(--sab)) var(--gl)}
.tuto.open{display:flex}
.tuto .top{font:400 14px/1 var(--serif);letter-spacing:.22em;text-transform:uppercase;text-align:center;padding:10px 0 14px;border-bottom:1px solid var(--border)}
.tuto .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 0;overflow:hidden}
.tuto .player{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;flex:0 0 auto}
.tuto video{width:100%;height:100%;object-fit:contain;background:var(--bg);display:block}
.tuto .play{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;padding:0;display:grid;place-items:center;transition:opacity .3s}
.tuto .play svg{width:88px;height:88px;filter:drop-shadow(0 6px 14px rgba(26,26,26,.25))}
.tuto .player.playing .play{opacity:0;pointer-events:none}
.tuto .foot{display:flex;align-items:center;justify-content:center;padding-top:10px;border-top:1px solid var(--border)}
.tuto .skip{font:400 11px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink);min-height:48px;padding:0 28px;border:1px solid var(--ink)}

footer{padding:28px var(--gr) 28px var(--gl);text-align:center}
footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--border);font-style:normal;font-family:var(--sans);font-size:11px;letter-spacing:.06em}
@media (min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .intro h1{font-size:28px}
  .work{max-width:720px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
}
</style>
</head>
<body>

<header>
  <button class="back" id="back" type="button" data-i18n="back" data-i18n-aria="backAria">← Éditions</button>
  <a class="brand" href="#">Stéphane Alsac<small>Chez vous</small></a>
  <div class="hdr-r"><button class="lang-btn" id="lang" type="button" lang="en" aria-label="English">EN</button><button class="icon-btn" id="help" type="button" data-i18n-aria="helpAria"><span>?</span></button></div>
</header>

<main>
  <!-- ===== CATALOGUE ===== -->
  <section class="catalogue">
    <div class="intro"><h1 data-i18n="catTitle">Éditions sur Toile</h1></div>
    <div class="grid" id="grid"></div>
    <footer class="serif-note"><span data-i18n="footer">Éditions limitées, signées et numérotées.</span> <a id="site-link" href="https://www.stephane-alsac.com" target="_blank" rel="noopener">stephane-alsac.com</a></footer>
  </section>

  <!-- ===== FICHE ŒUVRE ===== -->
  <section class="work" id="work">
    <div class="hero"><img id="w-img" alt=""></div>
    <div class="work-head">
      <div class="tech" id="w-tech"></div>
      <h1 id="w-title"></h1>
    </div>

    <div class="section">
      <div class="label" id="sizes-label" data-i18n="chooseSize">Choisir la taille</div>
      <div class="sizes" id="sizes" role="radiogroup" aria-labelledby="sizes-label"></div>
      <div class="dims serif-note" id="dims"></div>
    </div>

    <!-- Android : model-viewer sert uniquement à lancer la réalité augmentée (Scene Viewer / WebXR), il n'est pas affiché -->
    <div class="ar-engine" aria-hidden="true">
      <model-viewer id="mv" interaction-prompt="none" ar ar-modes="webxr" ar-placement="wall" ar-scale="fixed" loading="eager" reveal="manual"><button slot="ar-button" hidden></button></model-viewer>
    </div>

    <div class="actions">
      <div class="ar-tip serif-note" id="ar-tip" data-i18n="tip">Approchez-vous à moins de 3 mètres du mur. Visez-le bien éclairé, avec un repère (plinthe, prise, cadre), et balayez-le lentement.</div>
      <div class="ar-msg serif-note" id="ar-msg" aria-live="polite"></div>
      <button class="btn primary" id="ar-btn" type="button" data-i18n="arBtn">Voir sur mon mur</button>
      <a class="link" id="buy" href="#" target="_blank" rel="noopener"><span data-i18n="buy">Acquérir ce tirage</span></a>
    </div>
  </section>
</main>

<!-- lien AR Quick Look (iOS) : un seul, gardé dans le DOM pour recevoir le tap sur la bannière -->
<a id="ql" rel="ar" href="#" aria-hidden="true" tabindex="-1" style="position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none"><img alt="" style="width:1px;height:1px"></a>

<!-- ===== TUTORIEL (vidéo) ===== -->
<div class="tuto" id="tuto" role="dialog" aria-modal="true" data-i18n-aria="tutoAria">
  <div class="top">Stéphane Alsac</div>
  <div class="stage"><div class="player"><video id="tuto-video" preload="metadata" playsinline data-i18n-aria="videoAria"></video>
    <button class="play" id="tuto-play" type="button" data-i18n-aria="playAria"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="rgba(238,234,225,.92)" stroke="#1a1a1a" stroke-width="1"/><path d="M19 15 L33 24 L19 33 Z" fill="#1a1a1a"/></svg></button></div></div>
  <div class="foot"><button class="skip" id="tuto-close" type="button" data-i18n="skip">Passer</button></div>
</div>

<script src="vendor/model-viewer.min.js" type="module"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const supportsAR = (() => { const a = document.createElement('a'); return !!(a.relList && a.relList.supports && a.relList.supports('ar')); })();
  const quickLook = isIOS && supportsAR;
  const iosNoAR = isIOS && !supportsAR;                 // navigateur intégré (app Claude, Instagram, etc.) : pas de RA, il faut Safari
  const isMobile = isIOS || isAndroid || (navigator.maxTouchPoints > 0 && /Mobi|Tablet/i.test(ua));
  const safariLink = () => 'x-safari-' + location.href;  // ouvre l'adresse dans Safari depuis un navigateur intégré
  const fmtEur = n => n == null ? '' : String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g, ' ') + ' €';
  const fmtCm = n => String(n).replace('.', ',');

  let cat = null, work = null, size = null;

  // ---------- langues : français / anglais américain ----------
  // ?lang=en|fr, sinon le dernier choix, sinon la langue du téléphone (français → fr, tout le reste → en)
  const I18N = {
    fr: {
      back: '← Éditions', backAria: 'Retour aux éditions', helpAria: 'Revoir le tutoriel', catTitle: 'Éditions sur Toile',
      footer: 'Éditions limitées, signées et numérotées.', chooseSize: 'Choisir la taille',
      tip: 'Approchez-vous à moins de 3 mètres du mur. Visez-le bien éclairé, avec un repère (plinthe, prise, cadre), et balayez-le lentement.',
      arBtn: 'Voir sur mon mur', buy: 'Acquérir ce tirage', tutoAria: 'Comment ça marche',
      videoAria: 'Tutoriel : choisissez une œuvre, un format, puis visez votre mur', playAria: 'Lire le tutoriel', skip: 'Passer', start: 'Commencer',
      formats: n => n + ' formats', from: 'dès', tech: 'Édition sur Toile', copies: n => n + ' exemplaires signés et numérotés',
      dims: (c, f, pf, pu) => `Toile <b>${c}</b> · encadrée caisse américaine <b>${f}</b>${pf ? ' · <b>' + pf + '</b> encadrée' : ''}${pu ? ', <b>' + pu + '</b> toile seule' : ''}`,
      title: 'Chez vous — Stéphane Alsac', workTitle: t => t + ' chez vous — Stéphane Alsac',
      loadErr: 'Le catalogue n\'a pas pu être chargé. Vérifiez votre connexion, puis rouvrez la page.',
      ios: 'L\'œuvre s\'accroche dès que le mur est reconnu. Glissez-la d\'un seul doigt, sans quitter le mur. Elle se décroche ? Touchez « Objet » puis « AR ». Pour changer de format, revenez ici.',
      iosDirect: 'Rien ne s\'ouvre ? Touchez ici.', opening: 'Ouverture de la réalité augmentée…',
      safari: 'Pour la réalité augmentée, ouvrez cette page dans Safari.', openSafari: 'Ouvrir dans Safari',
      noArMobile: 'La réalité augmentée n\'est pas disponible dans ce navigateur. Ouvrez la page dans Safari ou Chrome.',
      noArDesktop: 'La réalité augmentée fonctionne sur iPhone, iPad et Android : ouvrez cette page sur votre téléphone.',
      arKo: 'La réalité augmentée ne s\'ouvre pas dans ce navigateur. Ouvrez la page dans Chrome, et mettez à jour « Services Google Play pour la RA » dans le Play Store.',
      langBtn: 'EN', langAria: 'English'
    },
    en: {
      back: '← Editions', backAria: 'Back to the editions', helpAria: 'Watch the tutorial again', catTitle: 'Canvas Editions',
      footer: 'Limited editions, signed and numbered.', chooseSize: 'Choose a size',
      tip: 'Stand less than 10 feet from the wall. Aim at a well-lit wall with a landmark (baseboard, outlet, frame) and sweep it slowly.',
      arBtn: 'View on my wall', buy: 'Buy this print', tutoAria: 'How it works',
      videoAria: 'Tutorial: choose a piece, a size, then aim at your wall', playAria: 'Play the tutorial', skip: 'Skip', start: 'Get started',
      formats: n => n + ' sizes', from: 'from', tech: 'Canvas Edition', copies: n => n + ' signed and numbered prints',
      dims: (c, f, pf, pu) => `Canvas <b>${c}</b> · black floater frame <b>${f}</b>${pf ? ' · <b>' + pf + '</b> framed' : ''}${pu ? ', <b>' + pu + '</b> canvas only' : ''}`,
      title: 'Chez vous — Stéphane Alsac', workTitle: t => t + ' on your wall — Stéphane Alsac',
      loadErr: 'The catalog could not be loaded. Check your connection, then reopen the page.',
      ios: 'The piece hangs itself as soon as the wall is recognized. Slide it with one finger, without leaving the wall. If it comes off, tap “Object”, then “AR”. To change the size, come back here.',
      iosDirect: 'Nothing opens? Tap here.', opening: 'Opening augmented reality…',
      safari: 'For augmented reality, open this page in Safari.', openSafari: 'Open in Safari',
      noArMobile: 'Augmented reality isn\'t available in this browser. Open the page in Safari or Chrome.',
      noArDesktop: 'Augmented reality works on iPhone, iPad and Android: open this page on your phone.',
      arKo: 'Augmented reality won\'t open in this browser. Open the page in Chrome, and update “Google Play Services for AR” in the Play Store.',
      langBtn: 'FR', langAria: 'Français'
    }
  };
  const VIDEO = { fr: ['tuto.mp4?v=1271526a', 'tuto-poster.jpg?v=e49f0f40'], en: ['tuto-en.mp4?v=6ddc85ea', 'tuto-en-poster.jpg?v=4c00c0dd'] };
  let LANG = (() => {
    const q = new URLSearchParams(location.search).get('lang'); if (q === 'fr' || q === 'en') return q;
    try { const l = localStorage.getItem('lang'); if (l === 'fr' || l === 'en') return l; } catch (_) {}
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'fr';
    return /^fr/i.test(nav) ? 'fr' : 'en';
  })();
  const T = k => I18N[LANG][k];
  const EN = () => LANG === 'en';
  const fmtUsd = n => n == null ? '' : '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g, ',');
  const fmtIn = cm => String(Math.round(cm / 2.54 * 10) / 10);
  const sizeTxt = (w, h) => EN() ? `${fmtIn(w)} × ${fmtIn(h)} in` : `${fmtCm(w)} × ${fmtCm(h)} cm`;   // pouces pour l'anglais américain
  // champs du catalogue selon la langue (repli sur le français si la boutique anglaise n'a pas l'info)
  const wTitle = w => (EN() && w.title_en) || w.title;
  const wUrl = w => (EN() && w.url_en) || w.url;
  const sLabel = s => (EN() && s.label_en) || s.label;
  const pFramed = s => EN() ? (s.price_framed_usd ? fmtUsd(s.price_framed_usd) : '') : (s.price_framed ? fmtEur(s.price_framed) : '');
  const pUnframed = s => EN() ? (s.price_unframed_usd ? fmtUsd(s.price_unframed_usd) : '') : (s.price_unframed ? fmtEur(s.price_unframed) : '');
  function applyLang(){
    document.documentElement.lang = EN() ? 'en-US' : 'fr';
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', T(e.dataset.i18nAria)); });
    const lb = $('#lang'); lb.textContent = T('langBtn'); lb.setAttribute('aria-label', T('langAria')); lb.setAttribute('lang', EN() ? 'fr' : 'en');
    $('#site-link').href = EN() ? 'https://www.stephane-alsac.com/en/' : 'https://www.stephane-alsac.com';
    const v = $('#tuto-video'), [src, poster] = VIDEO[LANG];
    if (v.getAttribute('data-src') !== src){ v.pause(); v.setAttribute('poster', poster); v.innerHTML = `<source src="${src}" type="video/mp4">`; v.setAttribute('data-src', src); v.load(); }
  }
  applyLang();
  $('#lang').addEventListener('click', () => {
    LANG = EN() ? 'fr' : 'en'; try { localStorage.setItem('lang', LANG); } catch (_) {}
    applyLang(); if (cat){ buildGrid(); const w = work, s = size; work = null; if (w) openWork(w, s); else route(); }
  });

  fetch('catalogue.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(c => { cat = c; buildGrid(); route(); })
    .catch(() => { $('#grid').innerHTML = '<div class="empty">' + esc(T('loadErr')) + '</div>'; });

  // ---------- catalogue ----------
  function buildGrid(){
    const g = $('#grid'); g.innerHTML = '';
    for (const w of cat.works){
      const min = Math.min(...w.sizes.map(s => (EN() ? s.price_framed_usd : s.price_framed) || Infinity));
      const a = document.createElement('a');
      a.className = 'card'; a.href = '#' + w.slug;
      a.innerHTML = `<div class="ph"><img src="${w.thumb_url || w.thumb}" alt="${esc(wTitle(w))}" loading="lazy"></div>
        <h2>${esc(wTitle(w))}</h2>
        <div class="meta">${w.sizes.length > 1 ? T('formats')(w.sizes.length) : sizeTxt(w.sizes[0].w, w.sizes[0].h)}${isFinite(min) ? ' · ' + T('from') + ' ' + (EN() ? fmtUsd(min) : fmtEur(min)) : ''}</div>`;
      g.appendChild(a);
    }
  }

  // ---------- routage #slug/taille ----------
  function route(){
    if (!cat) return;
    const h = location.hash.replace(/^#/, '');
    const [slug, sz] = h.split('/');
    const w = cat.works.find(x => x.slug === slug);
    if (!w){ document.body.classList.remove('view-work'); work = null; document.title = T('title'); return; }
    openWork(w, w.sizes.find(s => s.slug === sz) || w.sizes[0]);
  }
  window.addEventListener('hashchange', route);
  $('#back').addEventListener('click', () => { location.hash = ''; });

  function openWork(w, s){
    const changed = work !== w;
    work = w;
    document.body.classList.add('view-work');
    if (changed){
      window.scrollTo(0, 0);
      $('#w-img').src = w.image_url || w.image; $('#w-img').alt = wTitle(w);
      $('#w-title').textContent = wTitle(w);
      $('#w-tech').textContent = T('tech') + (w.edition ? ' · ' + T('copies')(w.edition) : '');
      $('#buy').href = wUrl(w);
      document.title = T('workTitle')(wTitle(w));
      const sz = $('#sizes'); sz.innerHTML = '';
      for (const x of w.sizes){
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'size'; b.dataset.slug = x.slug; b.setAttribute('role', 'radio');
        b.innerHTML = `<div class="l">${esc(sLabel(x))}</div><div class="d">${sizeTxt(x.w, x.h)}</div><div class="p">${pFramed(x)}</div>`;
        b.addEventListener('click', () => { history.replaceState(null, '', '#' + w.slug + '/' + x.slug); selectSize(x); });
        sz.appendChild(b);
      }
    }
    selectSize(s);
  }

  function selectSize(s){
    size = s;
    document.querySelectorAll('.size').forEach(b => b.setAttribute('aria-checked', b.dataset.slug === s.slug ? 'true' : 'false'));
    const o = s.framed_cm || s.outer_cm;   // taille encadrée telle que le site l’affiche (sinon calculée)
    $('#dims').innerHTML = T('dims')(sizeTxt(s.w, s.h), sizeTxt(o.w, o.h), pFramed(s), pUnframed(s));
    const mv = $('#mv');
    mv.setAttribute('alt', wTitle(work) + ', ' + sLabel(s));
    if (isAndroid) mv.setAttribute('src', s.glb);
    if (isIOS) prefetch(s.usdz);   // le fichier est en cache avant le premier appui sur « Voir sur mon mur »
    setMsg('');
    if (iosNoAR) { const m = $('#ar-msg'); m.innerHTML = esc(T('safari')) + '<br><a href="' + esc(safariLink()) + '" style="color:inherit">' + esc(T('openSafari')) + '</a>'; m.classList.add('on'); }
  }
  const prefetched = new Set();
  function prefetch(u){ if (prefetched.has(u)) return; prefetched.add(u); try { fetch(u, { mode: 'same-origin', credentials: 'omit' }).then(r => r.arrayBuffer()).catch(() => {}); } catch (_) {} }
  if (quickLook || isAndroid) document.body.classList.add('ar-ok');
  function setMsg(t){ const m = $('#ar-msg'); m.textContent = t; m.classList.toggle('on', !!t); }

  // ---------- AR ----------
  const ql = $('#ql');
  ql.addEventListener('message', e => { if (e.data === '_apple_ar_quicklook_button_tapped' && work) location.href = wUrl(work); }, false);
  function usdzHref(){
    const enc = encodeURIComponent;
    const frag = [
      'allowsContentScaling=0',
      'canonicalWebPageURL=' + enc(wUrl(work)),
      'callToAction=' + enc(T('buy')),
      'checkoutTitle=' + enc(wTitle(work)),
      'checkoutSubtitle=' + enc(`${sLabel(size)} · ${sizeTxt(size.w, size.h)}`)
    ];
    if (pFramed(size)) frag.push('price=' + enc(pFramed(size)));
    return new URL(size.usdz, location.href).toString() + '#' + frag.join('&');
  }
  $('#ar-btn').addEventListener('click', () => {
    if (!work || !size) return;
    if (quickLook){
      const href = usdzHref();
      // Safari n'applique allowsContentScaling=0 (pas de zoom à deux doigts) que si le lien contient une vraie image
      const thumb = new URL(work.thumb_url || work.thumb, location.href).toString();
      ql.querySelector('img').src = thumb;
      ql.setAttribute('href', href);
      ql.click();
      // secours : si Quick Look ne s'ouvre pas, un lien direct vers le fichier (Safari l'ouvre lui-même en 3D / RA)
      const m = $('#ar-msg');
      m.innerHTML = esc(T('ios')) + '<br><a id="ql-direct" rel="ar" href="' + esc(href) + '" style="color:inherit"><img src="' + esc(thumb) + '" alt="" style="display:inline-block;width:22px;height:22px;object-fit:cover;vertical-align:-5px;margin:0 8px 0 0">' + esc(T('iosDirect')) + '</a>';
      m.classList.add('on');
    } else if (isAndroid){
      // WebXR dans Chrome (testé sur Samsung S26) : la visionneuse de l'appli Google plante sur certains téléphones
      const mv = $('#mv'), eng = document.querySelector('.ar-engine');
      eng.classList.add('live');
      setMsg(T('opening'));
      const go = () => { try { mv.activateAR(); } catch (_) { eng.classList.remove('live'); setMsg(T('arKo')); } };
      if (mv.loaded) go(); else mv.addEventListener('load', go, { once: true });
    } else if (iosNoAR){
      location.href = safariLink();
    } else {
      setMsg(isMobile ? T('noArMobile') : T('noArDesktop'));
    }
  });
  $('#mv').addEventListener('ar-status', e => {
    const eng = document.querySelector('.ar-engine');
    if (e.detail.status === 'failed') { eng.classList.remove('live'); setMsg(T('arKo')); }
    if (e.detail.status === 'session-started') setMsg('');
    if (e.detail.status === 'not-presenting') { eng.classList.remove('live'); setMsg(''); }
  });

  // ---------- tutoriel (vidéo) : à la première visite, puis via « ? » — pas de lecture automatique ----------
  const tuto = $('#tuto'), video = $('#tuto-video'), player = tuto.querySelector('.player'); let lastFocus = null;
  function openTuto(){
    lastFocus = document.activeElement; tuto.classList.add('open'); document.body.classList.add('tuto-open');
    video.pause(); video.currentTime = 0; player.classList.remove('playing'); $('#tuto-close').textContent = T('skip');
  }
  function closeTuto(){
    tuto.classList.remove('open'); document.body.classList.remove('tuto-open'); video.pause();
    try { localStorage.setItem('ar_tuto_seen', '1'); } catch (_) {}
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  $('#tuto-play').addEventListener('click', () => { video.muted = false; const p = video.play(); if (p && p.catch) p.catch(() => {}); });
  video.addEventListener('play', () => player.classList.add('playing'));
  video.addEventListener('pause', () => { if (!video.ended) player.classList.remove('playing'); });
  video.addEventListener('ended', () => { player.classList.remove('playing'); $('#tuto-close').textContent = T('start'); });
  video.addEventListener('click', () => { if (!video.paused) video.pause(); });
  $('#tuto-close').addEventListener('click', closeTuto);
  $('#help').addEventListener('click', openTuto);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && tuto.classList.contains('open')) closeTuto(); });
  let seen = true; try { seen = localStorage.getItem('ar_tuto_seen') === '1'; } catch (_) {}
  if (!seen && !location.hash) openTuto();   // première visite sur la page d'accueil seulement (pas sur un lien direct vers une œuvre)

  // ---------- ancien cache hors-ligne : on le retire (il faisait rater le premier lancement de la RA sur Safari) ----------
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
})();
</script>
</body>
</html>
