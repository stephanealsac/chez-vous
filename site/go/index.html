<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eeeae1">
<title>Chez vous — Stéphane Alsac</title>
<meta name="description" content="Voyez les Éditions sur toile de Stéphane Alsac sur votre mur, à taille réelle.">
<link rel="icon" href="../icon-180.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Page d'accueil des QR codes du catalogue papier (app.stephane-alsac.com).
   Elle peut être modifiée à tout moment sans réimprimer : les QR codes pointent ici, pas vers l'appli. */
:root{--bg:#eeeae1;--ink:#1a1a1a;--soft:#4a4a4a;--muted:#6a665e;--border:#d4cfc4;--brun:#7F3A24;--brun-fonce:#5E2A1A;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Raleway',system-ui,-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(32px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom));text-align:center;font-family:var(--sans)}
.logo{width:120px;height:120px;border:1px solid var(--border)}
.brand{margin-top:26px;font:400 15px/1 var(--serif);letter-spacing:.22em;text-transform:uppercase;padding-left:.22em}
h1{margin-top:10px;font:italic 300 44px/1.05 var(--serif)}
p.lead{margin-top:18px;max-width:330px;font:italic 300 21px/1.35 var(--serif);color:var(--soft);text-wrap:balance}
.btns{margin-top:34px;width:100%;max-width:340px;display:flex;flex-direction:column}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 18px;font:400 11px/1.2 var(--sans);letter-spacing:.25em;text-transform:uppercase;text-decoration:none;border:1px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.second{color:var(--ink)}
/* Variante iPhone (validation DA 8 nov. 2026) : appli en avant, navigateur en second */
.btn.store{background:var(--brun);border-color:var(--brun);color:#fff;transition:background-color .15s,border-color .15s}
.btn.store:hover,.btn.store:active{background:var(--brun-fonce);border-color:var(--brun-fonce)}
.btn.alt{background:transparent;border-color:var(--brun);color:var(--brun);margin-top:24px}
.sub{margin-top:14px;font:500 12px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#404040}
.sub[hidden]{display:none}
/* Version graphique iPhone (8 nov. 2026, inspirée de la page « Chez vous » du catalogue) */
.hero{display:none;width:100%;max-width:300px;height:auto;margin-top:18px;aspect-ratio:1;object-fit:cover;}
body.ios .hero{display:block}
body.ios .logo{display:none}
body.ios .brand{margin-top:0}
body.ios h1{font-size:40px}
body.ios p.lead{margin-top:2px;font-size:19px}
body.ios .btns{margin-top:24px}
.steps{display:none;list-style:none;width:100%;max-width:300px;margin:28px auto 0;padding-top:20px;border-top:1px solid #c9b7a6;text-align:left}
body.ios .steps{display:block}
.steps li{display:flex;align-items:baseline;gap:18px;padding:7px 0;font:400 11px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.steps li b{flex:0 0 14px;font:italic 400 22px/1 var(--serif);letter-spacing:0;color:var(--brun);text-align:center}
.btn[hidden]{display:none}
.note{margin-top:22px;max-width:320px;font:italic 300 16px/1.35 var(--serif);color:var(--muted)}
.foot{margin-top:40px;display:flex;gap:22px;align-items:center;font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.foot a{color:var(--soft);text-decoration:none;border-bottom:1px solid var(--border);padding-bottom:3px}
.foot button{background:none;border:0;font:inherit;letter-spacing:inherit;color:var(--soft);cursor:pointer;padding:10px}
</style>
</head>
<body>
  <img class="logo" src="icon-sa.svg" alt="">
  <div class="brand">Stéphane Alsac</div>
  <h1>Chez vous</h1>
  <img class="hero" id="hero" alt="" width="760" height="760">
  <p class="lead" id="lead"></p>
  <div class="btns">
    <a class="btn store" id="store" hidden></a>
    <p class="sub" id="sub" hidden></p>
    <ol class="steps" id="steps"></ol>
    <a class="btn" id="web"></a>
  </div>
  <p class="note" id="note"></p>
  <div class="foot"><a id="site" href="https://www.stephane-alsac.com">stephane-alsac.com</a><button id="lang" type="button"></button></div>
<script>
(function(){
  // ---- RÉGLAGES (à changer ici, sans réimprimer les QR codes) ----
  const APP_STORE_URL = 'https://apps.apple.com/app/id6828991225';   // lien App Store de l'appli ; vide = bouton caché
  const WEB_URL = 'https://chez-vous.stephane-alsac.com/';
  // -----------------------------------------------------------------
  const T = {
    fr: { lead: 'Voyez les Éditions sur toile de Stéphane Alsac sur votre mur, à taille réelle, avant de choisir.',
          store: 'Télécharger l’application', sub: 'Sur l’App Store · iPhone et iPad', hero: 'mur-fr.jpg', heroAlt: 'Un iPhone montre un tableau de zèbres accroché au mur du salon, à taille réelle',
          steps: ['Téléchargez l’application', 'Choisissez une œuvre et un format', 'Visez votre mur', 'Commandez en un geste'], web: 'Voir sur mon mur', webAlt: 'Ouvrir dans le navigateur',
          note: 'Gratuit, sans compte. iPhone, iPad et la plupart des téléphones Android récents.', other: 'English', site: 'https://www.stephane-alsac.com' },
    en: { lead: 'See Stéphane Alsac\'s Canvas Editions on your own wall, at actual size, before you choose.',
          store: 'Download the app', sub: 'On the App Store · iPhone and iPad', hero: 'mur-en.jpg', heroAlt: 'An iPhone shows a zebra painting hanging on a living-room wall, at actual size',
          steps: ['Download the app', 'Choose a piece and a size', 'Aim your phone at your wall', 'Order in one tap'], web: 'View on my wall', webAlt: 'Open in your browser',
          note: 'Free, no account needed. iPhone, iPad and most recent Android phones.', other: 'Français', site: 'https://www.stephane-alsac.com/en/' }
  };
  const q = new URLSearchParams(location.search);
  let L = q.get('lang');
  if (L !== 'fr' && L !== 'en') L = /^fr/i.test((navigator.languages && navigator.languages[0]) || navigator.language || 'fr') ? 'fr' : 'en';
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function render(){
    const t = T[L];
    document.documentElement.lang = L === 'en' ? 'en-US' : 'fr';
    document.getElementById('lead').textContent = t.lead;
    document.getElementById('note').textContent = t.note;
    const store = document.getElementById('store'), web = document.getElementById('web');
    const showStore = !!APP_STORE_URL && isIOS;
    store.hidden = !showStore; store.href = APP_STORE_URL || '#'; store.textContent = t.store;
    web.href = WEB_URL + '?lang=' + L + '&src=qr';
    web.textContent = showStore ? t.webAlt : t.web;
    web.className = 'btn ' + (showStore ? 'alt' : 'primary');
    document.body.classList.toggle('ios', showStore);
    if (showStore) {
      const hero = document.getElementById('hero'); hero.src = t.hero; hero.alt = t.heroAlt;
      document.getElementById('steps').innerHTML = t.steps.map((x, i) => '<li><b>' + (i + 1) + '</b><span>' + x + '</span></li>').join('');
    }
    const sub = document.getElementById('sub'); sub.hidden = !showStore; sub.textContent = t.sub;
    document.getElementById('lang').textContent = t.other;
    document.getElementById('site').href = t.site;
  }
  document.getElementById('lang').addEventListener('click', () => { L = L === 'fr' ? 'en' : 'fr'; render(); });
  render();
})();
</script>
</body>
</html>
