# Projet Xcode généré par XcodeGen (`xcodegen generate` dans ios/).
# Le dossier ChezVous/Catalogue (catalogue.json, img/, models/*.usdz, tuto.mp4) est copié depuis site/ par ios/prepare.sh.
name: ChezVous
options:
  bundleIdPrefix: com.stephanealsac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  ChezVous:
    type: application
    platform: iOS
    sources:
      - path: ChezVous
        excludes:
          - Catalogue
      - path: ChezVous/Catalogue
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephanealsac.chezvous
        PRODUCT_NAME: ChezVous
        INFOPLIST_FILE: ChezVous/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
